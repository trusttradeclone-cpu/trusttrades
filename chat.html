<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, user-scalable=no">
  <meta name="color-scheme" content="light">
  <title>Support Chat - Trust</title>
  <link rel="icon" type="image/png" href="img/logo.png">
  <link rel="apple-touch-icon" href="img/logo.png">
  <link rel="stylesheet" href="styles.css">
  <script src="app.js"></script>
</head>
<body class="auth-page chat-page" style="background:#f5f5f5;">

  <header class="sub-header">
    <button class="back-btn" onclick="location.href='account.html'" aria-label="Back">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>
    </button>
    <h1 class="header-title" data-i18n="chat.title">Support Chat</h1>
  </header>

  <main class="page" style="max-width:560px;padding-top:15px;">
    <div class="card" style="padding:14px;">
      <div class="chat-thread" id="chatThread"><div class="chat-welcome" data-i18n="chat.welcome">How can we help you?</div></div>
      <div class="chat-input-row" style="margin-top:12px;">
        <input type="text" class="form-input" id="chatInput" placeholder="Type a message..." data-i18n-ph="chat.typeMessage">
        <button class="btn btn-sm" id="chatSend" style="background:#1652f0;color:#fff;padding:12px 18px;" data-i18n="chat.send">Send</button>
      </div>
    </div>
  </main>

  <div class="toast-overlay" id="toastBox"></div>

  <script>
    var uid = TrustApp.getUserId();
    var lastSig = '';

    function esc(s) {
      return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
        return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
      });
    }
    function render() {
      var box = document.getElementById('chatThread');
      var msgs = TrustApp.getChat(uid);
      var sig = msgs.map(function (m) { return (m.mid || '') + '|' + (m.text || '') + '|' + (m.edited ? 1 : 0); }).join('~');
      if (sig === lastSig) return;
      lastSig = sig;
      if (!msgs.length) {
        box.innerHTML = '<div class="chat-welcome">' + TrustApp.t('chat.welcomeSub') + '</div>';
        return;
      }
      box.innerHTML = msgs.map(function (m) {
        var cls = m.from === 'admin' ? 'admin' : 'user';
        var tm = (m.at || '').replace('T', ' ').slice(0, 16);
        var edited = m.edited ? ' <span class="chat-edit-mark">' + TrustApp.t('chat.edited') + '</span>' : '';
        return '<div class="chat-msg ' + cls + '">' + esc(m.text) + edited + '<span class="chat-time">' + tm + '</span></div>';
      }).join('');
      box.scrollTop = box.scrollHeight;
    }
    document.getElementById('chatSend').onclick = function () {
      var input = document.getElementById('chatInput');
      var text = input.value.trim();
      if (!text) return;
      TrustApp.sendChatMsg(uid, 'user', text);
      input.value = '';
      lastSig = '';
      render();
    };
    document.getElementById('chatInput').addEventListener('keydown', function (e) {
      if (e.key === 'Enter') {
        e.preventDefault();
        var text = e.target.value.trim();
        if (!text) return;
        TrustApp.sendChatMsg(uid, 'user', text);
        e.target.value = '';
        lastSig = '';
        render();
      }
    });
    render();
    setInterval(render, 2000);
  </script>
</body>
</html>
