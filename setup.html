<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Trust — Database setup</title>
  <style>
    body { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; margin: 0; background: #0f172a; color: #e2e8f0; min-height: 100vh; }
    .card { max-width: 640px; margin: 48px auto; background: #1e293b; border: 1px solid #334155; border-radius: 14px; padding: 28px; }
    h1 { margin: 0 0 6px; font-size: 22px; color: #fff; }
    p { margin: 6px 0 18px; color: #94a3b8; line-height: 1.5; }
    label { display: block; margin: 14px 0 4px; font-size: 13px; color: #94a3b8; }
    input { width: 100%; box-sizing: border-box; padding: 10px 12px; border-radius: 8px; border: 1px solid #334155; background: #0f172a; color: #e2e8f0; font-size: 14px; }
    button { margin: 18px 6px 0 0; padding: 10px 16px; border: 0; border-radius: 8px; background: #2563eb; color: #fff; font-size: 14px; cursor: pointer; }
    button.secondary { background: #475569; }
    #status { margin-top: 14px; font-size: 13px; white-space: pre-wrap; }
    .ok { color: #4ade80; }
    .bad { color: #f87171; }
    code { background: #0f172a; padding: 2px 6px; border-radius: 4px; font-size: 12px; }
  </style>
</head>
<body>
  <div class="card">
    <h1>Supabase database setup</h1>
    <p>Paste the values from your Supabase project (Project Settings → API). The anon key is safe to store here; the service-role key is only used by the Node import tool below and should be emptied on a public server.</p>
    <label>Project URL</label>
    <input id="url" placeholder="https://xxxx.supabase.co">
    <label>Anon / public key</label>
    <input id="anon" placeholder="eyJ...">
    <label>Service-role key (optional, for the import tool only)</label>
    <input id="service" placeholder="eyJ...">
    <button onclick="save()">Save settings</button>
    <button class="secondary" onclick="reset()">Reset (localStorage only)</button>
    <div id="status"></div>
  </div>
  <script>
    function val(id) { return document.getElementById(id).value.trim(); }
    function save() {
      var st = document.getElementById('status');
      var cfg = { url: val('url'), anon: val('anon'), service: '' };
      var pr = val('service');
      if (pr) cfg.service = pr;
      try {
        localStorage.setItem('trustDbConfig', JSON.stringify(cfg));
        st.textContent = 'Saved. Reload any page to start syncing.';
        st.className = 'ok';
      } catch (e) {
        st.textContent = 'Could not save: ' + e.message;
        st.className = 'bad';
      }
    }
    function reset() {
      try { localStorage.removeItem('trustDbConfig'); } catch (e) {}
      var st = document.getElementById('status');
      st.textContent = 'Removed. Site is now localStorage-only.';
      st.className = 'ok';
    }
    try {
      var s = JSON.parse(localStorage.getItem('trustDbConfig') || 'null');
      if (s) { document.getElementById('url').value = s.url || ''; document.getElementById('anon').value = s.anon || ''; }
    } catch (e) {}
  </script>
</body>
</html>
