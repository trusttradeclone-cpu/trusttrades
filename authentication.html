<!DOCTYPE html>
<html lang="en">
<head>
  <base href="./">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, user-scalable=no">
  <meta name="color-scheme" content="light">
  <title>Identity Verification - Trust</title>
  <link rel="icon" type="image/png" href="favicon.png">
  <link rel="apple-touch-icon" href="img/logo.png">
  <link rel="stylesheet" href="styles.css">
  <script src="scripts/config.js"></script>
  <script src="scripts/supabase-client.js"></script>
    <script src="scripts/db.js"></script>
  <script src="app.js"></script>
  <style>
    .ver-banner{border-radius:12px;padding:12px 14px;font-size:13.5px;font-weight:600;margin-bottom:16px;}
    .ver-banner.ver-pending{background:#fff4e6;color:#b25e00;}
    .ver-banner.ver-approved{background:#e8f5e9;color:#07a353;}
    .ver-banner.ver-rejected{background:#ffebee;color:#d63649;}
    .ver-banner b{display:block;font-size:14px;margin-bottom:2px;}
    .ver-hint{font-size:12.5px;color:#8a94a6;margin:6px 0 0;}
  </style>
</head>
<body class="authentication-page" style="min-height:100vh;">

  <header class="sub-header">
    <button class="back-btn" onclick="location.href='index.html'" aria-label="Back">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18L9 12L15 6"/></svg>
    </button>
    <span class="header-title" data-i18n="auth.title">Identity Verification</span>
    <span class="header-spacer"></span>
  </header>

  <main>
    <div class="title-section" style="background:#1652f0;">
      <div class="title-info">
        <h2 class="title" data-i18n="auth.title">Identity Verification</h2>
        <p class="subtitle" data-i18n="auth.subtitle">Please upload a clear photo of the front of your ID</p>
      </div>
      <div class="title-icon">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="16" rx="2"/><circle cx="9" cy="10" r="2"/><path d="M3 16l4-4 4 4 8-8"/></svg>
      </div>
    </div>

    <div class="form-section">
      <div class="ver-banner" id="verStatus" style="display:none;"></div>
      <div class="form-item">
        <label class="form-label" data-i18n="auth.fullName">Full Name</label>
        <input type="text" class="form-input" id="vName" data-i18n-ph="auth.fullNamePh" placeholder="Please enter your full name">
      </div>
      <div class="form-item">
        <label class="form-label" data-i18n="auth.email">Email</label>
        <input type="email" class="form-input" id="vEmail" data-i18n-ph="auth.emailPh" placeholder="Please enter your email">
      </div>
      <div class="form-item">
        <label class="form-label" data-i18n="auth.idNumber">ID Number</label>
        <input type="text" class="form-input" id="vIdNumber" data-i18n-ph="auth.idNumberPh" placeholder="Please enter your ID number">
      </div>
      <div class="form-item">
        <label class="form-label" data-i18n="auth.phoneNumber">Phone Number</label>
        <input type="tel" class="form-input" id="vPhone" data-i18n-ph="auth.phonePh" placeholder="Please enter your phone number">
      </div>
      <div class="form-item">
        <label class="form-label" data-i18n="auth.idFront">ID Photo - Front Side</label>
        <div class="upload-container" onclick="document.getElementById('fileFront').click()">
          <svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="#1652f0" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" style="margin:0 auto 8px;"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4M17 8l-5-5-5 5M12 3v12"/></svg>
          <div class="upload-text" id="uploadTextFront" data-i18n="auth.clickUploadFront">Click to upload front of ID</div>
        </div>
        <input type="file" id="fileFront" accept="image/*" style="display:none;">
        <div class="upload-preview" id="previewFront"></div>
      </div>
      <div class="form-item">
        <label class="form-label" data-i18n="auth.idBack">ID Photo - Back Side</label>
        <div class="upload-container" onclick="document.getElementById('fileBack').click()">
          <svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="#1652f0" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" style="margin:0 auto 8px;"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4M17 8l-5-5-5 5M12 3v12"/></svg>
          <div class="upload-text" id="uploadTextBack" data-i18n="auth.clickUploadBack">Click to upload back of ID</div>
        </div>
        <input type="file" id="fileBack" accept="image/*" style="display:none;">
        <div class="upload-preview" id="previewBack"></div>
      </div>
      <button class="submit-btn" id="vSubmit" data-i18n="common.submit" style="width:100%;height:48px;background:#1652f0;color:#fff;border:none;border-radius:12px;font-size:16px;font-weight:600;cursor:pointer;margin-top:8px;">Submit</button>
      <div class="ver-hint" data-i18n="auth.reviewHint">After submission our team will review your documents and approve or reject them.</div>
    </div>
  </main>

  <div class="toast-overlay" id="toastBox"></div>

  <script>
    var MAX_VER_BYTES = 1200000;
    var photos = { front: null, back: null };

    function toast(type, msg) {
      var box = document.getElementById('toastBox');
      var el = document.createElement('div');
      el.className = 'toast-message toast-' + type;
      el.textContent = msg;
      box.appendChild(el);
      setTimeout(function () { el.remove(); }, 2000);
    }

    function compressImage(file, cb) {
      var img = new Image();
      var url = URL.createObjectURL(file);
      img.onload = function () {
        var maxW = 700;
        var scale = Math.min(1, maxW / img.width);
        var w = Math.max(1, Math.round(img.width * scale));
        var h = Math.max(1, Math.round(img.height * scale));
        var canvas = document.createElement('canvas');
        canvas.width = w; canvas.height = h;
        var ctx = canvas.getContext('2d');
        ctx.drawImage(img, 0, 0, w, h);
        URL.revokeObjectURL(url);
        cb(canvas.toDataURL('image/jpeg', 0.7));
      };
      img.onerror = function () { URL.revokeObjectURL(url); cb(null); };
      img.src = url;
    }

    function setupUpload(slot, inputId, previewId, textId) {
      var input = document.getElementById(inputId);
      var preview = document.getElementById(previewId);
      var text = document.getElementById(textId);
      input.addEventListener('change', function () {
        var file = input.files && input.files[0];
        if (!file) return;
        if (!/^image\//.test(file.type)) { toast('error', 'Please choose an image file'); return; }
        if (file.size > MAX_VER_BYTES) { toast('error', 'Photo is too large (max 1.2MB)'); return; }
        preview.innerHTML = '<div class="preview-item"><img alt="ID photo" class="preview-img"><button type="button" class="preview-remove" onclick="removePhoto(\'' + slot + '\')">&times;</button></div>';
        var img = preview.querySelector('.preview-img');
        compressImage(file, function (dataUrl) {
          if (!dataUrl) { toast('error', 'Could not read photo'); return; }
          photos[slot] = dataUrl;
          img.src = dataUrl;
        });
        text.textContent = t('auth.changePhoto');
        input.value = '';
      });
    }

    function removePhoto(slot) {
      photos[slot] = null;
      var text = slot === 'front' ? 'uploadTextFront' : 'uploadTextBack';
      document.getElementById(text).textContent = t('auth.clickUpload');
      document.getElementById(slot === 'front' ? 'previewFront' : 'previewBack').innerHTML = '';
    }

    function renderStatus() {
      var v = TrustApp.getVerification(TrustApp.getUserId());
      var box = document.getElementById('verStatus');
      if (!v || v.status === 'rejected') {
        box.style.display = 'none';
        return;
      }
      box.style.display = 'block';
      if (v.status === 'pending') {
        box.className = 'ver-banner ver-pending';
        box.innerHTML = '<b>' + t('auth.underReview') + '</b>' + t('auth.pendingText');
      } else if (v.status === 'approved') {
        box.className = 'ver-banner ver-approved';
        box.innerHTML = '<b>' + t('auth.verified') + '</b>' + t('auth.approvedText');
      }
      var fields = ['vName', 'vEmail', 'vIdNumber', 'vPhone'];
      fields.forEach(function (id) { var el = document.getElementById(id); if (el) el.disabled = true; });
      var btn = document.getElementById('vSubmit');
      if (btn) btn.disabled = true;
    }

    setupUpload('front', 'fileFront', 'previewFront', 'uploadTextFront');
    setupUpload('back', 'fileBack', 'previewBack', 'uploadTextBack');
    renderStatus();

    document.getElementById('vSubmit').onclick = function () {
      var uid = TrustApp.getUserId();
      var name = document.getElementById('vName').value.trim();
      var email = document.getElementById('vEmail').value.trim();
      var idNumber = document.getElementById('vIdNumber').value.trim();
      var phone = document.getElementById('vPhone').value.trim();
      if (!name || !email || !idNumber || !phone) { toast('error', 'Please fill in all fields'); return; }
      if (!photos.front || !photos.back) { toast('error', 'Please upload both sides of your ID'); return; }
      var res = TrustApp.submitVerification(uid, {
        name: name, email: email, idNumber: idNumber, phone: phone,
        idFront: photos.front, idBack: photos.back
      });
      if (!res.ok) { toast('error', res.msg); return; }
      toast('success', 'Verification submitted successfully, please wait for review');
      renderStatus();
    };
    setInterval(renderStatus, 4000);
    window.addEventListener('trustver', renderStatus);
    window.addEventListener('storage', function (e) {
      if (e.key === 'trustVerifications' || e.key === null) renderStatus();
    });
    var verSyncBusy = false;
    var verSyncDone = function () { verSyncBusy = false; };
    setInterval(function () {
      if (document.hidden || verSyncBusy) return;
      if (typeof DB === 'undefined' || !DB.pullBlob || !DB.ENABLED) return;
      verSyncBusy = true;
      DB.pullBlob('verifications').then(renderStatus).then(verSyncDone, verSyncDone);
    }, 1000);
  </script>
</body>
</html>
