            </button>
            <div class="language-menu" id="langMenu" style="display:none;">
              <div class="language-option active" onclick="setLang(this,'English')">English</div>
              <div class="language-option" onclick="setLang(this,'中文')">中文</div>
              <div class="language-option" onclick="setLang(this,'日本語')">日本語</div>
              <div class="language-option" onclick="setLang(this,'한국어')">한국어</div>
              <div class="language-option" onclick="setLang(this,'فارسی')">فارسی</div>
              <div class="language-option" onclick="setLang(this,'Deutsch')">Deutsch</div>
              <div class="language-option" onclick="setLang(this,'Français')">Français</div>
              <div class="language-option" onclick="setLang(this,'Español')">Español</div>
              <div class="language-option" onclick="setLang(this,'Italiano')">Italiano</div>
              <div class="language-option" onclick="setLang(this,'Português')">Português</div>

      <section class="hero-section">

        <div class="hero-content">

            <p class="hero-description"><span data-i18n="index.heroA">Smart Trading Starts Here</span><br><span data-i18n="index.heroB">Trusted Multi-Asset Trading Platform</span></p>
          </div>
          <div class="hero-right">
            <img src="img/logo.png" alt="Logo" class="logo-image">

      </section>

      <nav class="bottom-nav">
        <button class="nav-item" onclick="location.href='account.html'">
          <svg width="30" height="30" viewBox="0 0 24 24" fill="none"><circle cx="12" cy="8" r="4" stroke="currentColor" stroke-width="2"></circle><path d="M6 21v-2a4 4 0 0 1 4-4h4a4 4 0 0 1 4 4v2" stroke="currentColor" stroke-width="2"></path></svg>
          <span data-i18n="nav.account">Account</span>
        </button>
        <button class="nav-item" onclick="location.href='ai.html'">
          <svg width="30" height="30" viewBox="0 0 24 24" fill="none"><rect x="4" y="3" width="16" height="18" rx="4" stroke="currentColor" stroke-width="2"></rect><text x="12" y="16" font-size="10" font-weight="bold" fill="currentColor" text-anchor="middle" font-family="Arial, sans-serif">AI</text></svg>
          <span data-i18n="nav.ai">AI Quant</span>
        </button>
        <button class="nav-item" onclick="location.href='orders.html'">
          <svg width="30" height="30" viewBox="0 0 24 24" fill="none"><path d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z" stroke="currentColor" stroke-width="2"></path></svg>
          <span data-i18n="nav.record">Record</span>
        </button>
        <button class="nav-item" onclick="service()">
          <svg width="30" height="30" viewBox="0 0 24 24" fill="none"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"></path><path d="M8 9h8" stroke="currentColor" stroke-width="2" stroke-linecap="round"></path><path d="M8 13h6" stroke="currentColor" stroke-width="2" stroke-linecap="round"></path></svg>
          <span data-i18n="nav.service">Service</span>
        </button>
      </nav>

      <section class="market-section">
        <h2 class="market-title" data-i18n="index.market">Market</h2>
        <div class="market-tabs">
          <button class="tab-btn active" data-tab="crypto" onclick="switchTab(this,'crypto')"><span data-i18n="index.tabCrypto">Crypto</span></button>
          <button class="tab-btn" data-tab="metal" onclick="switchTab(this,'metal')"><span data-i18n="index.tabMetal">Metal</span></button>
          <button class="tab-btn" data-tab="forex" onclick="switchTab(this,'forex')"><span data-i18n="index.tabForex">Forex</span></button>
        </div>
        <div class="market-list" id="marketList"></div>
      </section>
    </div>
  </div>

  <div class="side-menu-overlay" id="sideMenu" style="display:none;" onclick="closeMenu(event)">
    <div class="side-menu" onclick="event.stopPropagation()">
      <header class="menu-header">
        <div>
          <h2 class="menu-title">Web3.0</h2>
          <div class="menu-id">ID: Not Logged In</div>
        </div>
        <button class="close-btn" onclick="closeMenu()">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 6L6 18M6 6L18 18" stroke-linecap="round"></path></svg>
        </button>
      </header>
      <div class="vip-area"><span class="vip-label">Function</span></div>
      <div class="menu-items">
        <div class="menu-item" onclick="location.href='account.html'">
          <span class="menu-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="8" r="4"></circle><path d="M6 21v-2a4 4 0 0 1 4-4h4a4 4 0 0 1 4 4v2"></path></svg></span>
          <span data-i18n="nav.account">Account</span>
        </div>
        <div class="menu-item" onclick="location.href='authentication.html'">
          <span class="menu-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="11" width="18" height="10" rx="2"></rect><circle cx="12" cy="16" r="1.5"></circle><path d="m7 11V7a5 5 0 0 1 10 0v4"></path></svg></span>
          <span data-i18n="menu.authentication">Authentication</span>
        </div>
        <div class="menu-item menu-advanced-auth" style="display:none;" onclick="location.href='advanced-auth.html'">
          <span class="menu-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 2L2 7l10 5 10-5-10-5z"></path><path d="M2 17l10 5 10-5M2 12l10 5 10-5"></path></svg></span>
          <span data-i18n="menu.advancedAuth">Advanced Authentication</span>
        </div>
        <div class="menu-item" onclick="location.href='orders.html'">
          <span class="menu-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"></path></svg></span>
          <span data-i18n="nav.record">Record</span>
        </div>
        <div class="menu-item" onclick="location.href='service.html'">
          <span class="menu-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z"></path></svg></span>
          <span data-i18n="menu.customerService">Customer Service</span>
        </div>
        <div class="menu-item" onclick="location.href='change-password.html'">
          <span class="menu-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="11" width="18" height="11" rx="2"></rect><path d="M7 11V7a5 5 0 0 1 10 0v4"></path></svg></span>
          <span data-i18n="menu.changePassword">Change Password</span>
        </div>
        <div class="menu-item" id="menuAdmin" style="display:none;" onclick="location.href='admin.html'">
          <span class="menu-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 2l8 4v6c0 5-3.5 8.5-8 10-4.5-1.5-8-5-8-10V6l8-4z"></path><path d="M9 12l2 2 4-4"></path></svg></span>
          <span data-i18n="menu.admin">Admin</span>
        </div>
        <div class="menu-item" onclick="TrustApp.logout(); location.href='login.html'">
          <span class="menu-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4M16 17l5-5-5-5M21 12H9"></path></svg></span>
          <span data-i18n="menu.quit">Quit</span>
        </div>
      </div>
    </div>
  </div>

  <div class="toast-overlay" id="toastBox"></div>

  <script>
    var currentTab = 'crypto';
    var urlTab = new URLSearchParams(location.search).get('tab');
    if (urlTab && (urlTab === 'crypto' || urlTab === 'metal' || urlTab === 'forex')) {
      currentTab = urlTab;
    }
    if (AppConfig.metalTabFirst) currentTab = urlTab || 'metal';

    document.querySelectorAll('.market-tabs .tab-btn').forEach(function (b) {
      b.classList.toggle('active', b.getAttribute('data-tab') === currentTab);
    });

    var prevPrice = {};

    function renderMarket() {
      var list = document.getElementById('marketList');
      var data = TrustApp.MARKET[currentTab] || [];
      var html = '';
      for (var i = 0; i < data.length; i++) {
        var d = data[i];
        var icon = d.i ? '<img src="img/' + d.i + '" alt="' + d.s + '">' : '<span class="coin-letter">' + d.s.charAt(0) + '</span>';
        var prefix = TrustApp.pricePrefix(d);
        html += '<div class="market-item" data-coin="' + (d.pair || d.s) + '" onclick="location.href=\'' + TrustApp.marketToTradeQuery(d, currentTab) + '\'">'
          + '<div class="market-info">'
          + '<div class="market-icon">' + icon + '</div>'
          + '<div class="market-details"><div class="market-symbol">' + d.s + '</div><div class="market-name">' + d.n + '</div></div>'
          + '</div>'
          + '<div class="market-price"><div class="price">' + prefix + TrustApp.fmtPrice(d.price, d.dec) + '</div>'
          + '<div class="change ' + (d.change >= 0 ? 'positive' : 'negative') + '">' + (d.change >= 0 ? '+' : '') + d.change.toFixed(2) + '% <span class="time-period">' + t('index.hrs') + '</span></div>'
          + '</div></div>';
      }
      list.innerHTML = html;
    }

    function switchTab(el, tab) {
      document.querySelectorAll('.market-tabs .tab-btn').forEach(function (b) { b.classList.remove('active'); });
      el.classList.add('active');
      currentTab = tab;
      renderMarket();
    }

    function updatePrices() {
      var items = document.querySelectorAll('#marketList .market-item');
      for (var i = 0; i < items.length; i++) {
        var el = items[i];
        var d = TrustApp.findCoin(el.getAttribute('data-coin'));
        if (!d) continue;
        var pr = el.querySelector('.price');
        var ch = el.querySelector('.change');
        if (!pr || !ch) continue;
        var dkey = d.pair || d.s;
        if (prevPrice[dkey] !== undefined && d.price !== prevPrice[dkey]) {
          pr.classList.remove('flash-up', 'flash-down');
          pr.classList.add(d.price > prevPrice[dkey] ? 'flash-up' : 'flash-down');
          (function (node) {
            setTimeout(function () { node.classList.remove('flash-up', 'flash-down'); }, 800);
          })(pr);
        }
        prevPrice[dkey] = d.price;
        pr.textContent = TrustApp.pricePrefix(d) + TrustApp.fmtPrice(d.price, d.dec);
        ch.className = 'change ' + (d.change >= 0 ? 'positive' : 'negative');
        ch.childNodes[0].textContent = (d.change >= 0 ? '+' : '') + d.change.toFixed(2) + '%';
      }
    }

    renderMarket();
    setInterval(function () {
      TrustApp.liveTick(currentTab, updatePrices);
    }, 2000);
    TrustApp.fetchMarket(function () {
      renderMarket();
    });

    TrustApp.updateMenuUser();
    if (TrustApp.applyWalletBtn) TrustApp.applyWalletBtn();
    if (TrustApp.isCurrentUserAdmin()) {
      var adminItem = document.getElementById('menuAdmin');
      if (adminItem) adminItem.style.display = '';
    }
    if (AppConfig.advancedAuthEnabled) {
      var adv = document.querySelector('.menu-advanced-auth');
      if (adv) adv.style.display = '';
    }
    function renderWalletBalance() {
      if (!TrustApp.isLoggedIn()) return;
      var uid = TrustApp.getUserId();
      var el = document.getElementById('walletBalanceAmount');
      if (!el || !uid) return;
      var b = TrustApp.getBalances(uid);
      var total = 0;
      Object.keys(b).forEach(function (sym) {
        var bal = parseFloat(b[sym]) || 0;
        if (!bal) return;
        if (sym === 'USDT') { total += bal; return; }
        var d = TrustApp.findCoin ? TrustApp.findCoin(sym) : null;
        var price = d ? (parseFloat(d.price) || 0) : 0;
        total += bal * price;
      });
      el.textContent = '$ ' + total.toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
    }
    if (TrustApp.isLoggedIn()) {
      document.getElementById('walletBtn').style.display = 'none';
      document.getElementById('walletBalance').style.display = 'flex';
      renderWalletBalance();
      window.addEventListener('storage', function (e) {
        if (e.key === 'trustBalances' || e.key === null) renderWalletBalance();
      });
      document.addEventListener('visibilitychange', function () {
        if (!document.hidden) renderWalletBalance();
      });
    }
  </script>
</body>
</html>
