<!DOCTYPE html>
<html lang="en">
<head>
  <base href="./">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, user-scalable=no">
  <meta name="color-scheme" content="light">
  <title>Advanced Authentication - Trust</title>
  <link rel="icon" type="image/png" href="favicon.png">
  <link rel="apple-touch-icon" href="img/logo.png">
  <link rel="stylesheet" href="styles.css">
  <script src="scripts/config.js"></script>
  <script src="scripts/supabase-client.js"></script>
    <script src="scripts/db.js"></script>
  <script src="app.js"></script>
  <style>
    .ver-banner{border-radius:12px;padding:12px 14px;font-size:13.5px;font-weight:600;margin-bottom:16px;}
    .ver-banner.ver-pending{background:#fff4e6;color:#b25e00;}
    .ver-banner.ver-approved{background:#e8f5e9;color:#07a353;}
    .ver-banner.ver-rejected{background:#ffebee;color:#d63649;}
    .ver-banner b{display:block;font-size:14px;margin-bottom:2px;}
    .ver-hint{font-size:12.5px;color:#8a94a6;margin:6px 0 0;}
    .adv-photo-preview{width:100%;border-radius:12px;overflow:hidden;position:relative;margin-top:10px;}
    .adv-photo-preview img{width:100%;height:auto;display:block;border-radius:12px;}
    .adv-photo-remove{position:absolute;top:8px;right:8px;background:rgba(0,0,0,.55);color:#fff;border:none;border-radius:50%;width:28px;height:28px;font-size:18px;line-height:1;cursor:pointer;}
  </style>
</head>
<body class="authentication-page" style="min-height:100vh;">

  <header class="sub-header">
    <button class="back-btn" onclick="location.href='index.html'" aria-label="Back">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18L9 12L15 6"/></svg>
    </button>
    <span class="header-title" data-i18n="adv.title">Advanced Authentication</span>
    <span class="header-spacer"></span>
  </header>

  <main>
    <div class="title-section" style="background:#1652f0;">
      <div class="title-info">
        <h2 class="title" data-i18n="adv.title">Advanced Authentication</h2>
        <p class="subtitle" data-i18n="adv.subtitle">Please upload handheld ID photo</p>
      </div>
      <div class="title-icon">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="6" width="18" height="14" rx="2"/><path d="M9 12h6M12 9v6"/></svg>
      </div>
    </div>

    <div class="form-section">
      <div class="ver-banner" id="verStatus" style="display:none;"></div>
      <div class="form-item">
        <label class="form-label" data-i18n="adv.handheld">Handheld ID Photo</label>
        <div class="upload-container" onclick="document.getElementById('advInput').click()">
          <svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="#1652f0" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" style="margin:0 auto 8px;"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4M17 8l-5-5-5 5M12 3v12"/></svg>
          <div class="upload-text" id="uploadText" data-i18n="adv.clickUpload">Click to upload handheld ID photo</div>
        </div>
        <input type="file" id="advInput" accept="image/*" style="display:none;">
        <div class="adv-photo-preview" id="previewBox" style="display:none;"></div>
        <p class="hint" style="margin-top:10px;" data-i18n="adv.hint">Please hold your ID card and take a clear photo</p>
      </div>
      <button class="submit-btn" id="advSubmit" data-i18n="common.submit" style="width:100%;height:48px;background:#1652f0;color:#fff;border:none;border-radius:12px;font-size:16px;font-weight:600;cursor:pointer;margin-top:8px;">Submit</button>
      <div class="ver-hint">After submission our team will review your advanced verification request.</div>
    </div>
  </main>

  <div class="toast-overlay" id="toastBox"></div>

  <script>
    var MAX_BYTES = 1200000;
    var photo = null;

    function toast(type, msg) {
      var box = document.getElementById('toastBox');
      var el = document.createElement('div');
      el.className = 'toast-message toast-' + type;
      el.textContent = msg;
      box.appendChild(el);
      setTimeout(function () { el.remove(); }, 2200);
    }

    function compress(file, cb) {
      var img = new Image();
      var url = URL.createObjectURL(file);
      img.onload = function () {
        var maxW = 700;
        var scale = Math.min(1, maxW / img.width);
        var w = Math.max(1, Math.round(img.width * scale));
        var h = Math.max(1, Math.round(img.height * scale));
        var canvas = document.createElement('canvas');
        canvas.width = w; canvas.height = h;
        var ctx = canvas.getContext('2d');
        ctx.drawImage(img, 0, 0, w, h);
        URL.revokeObjectURL(url);
        cb(canvas.toDataURL('image/jpeg', 0.7));
      };
      img.onerror = function () { URL.revokeObjectURL(url); cb(null); };
      img.src = url;
    }

    function renderStatus() {
      var v = TrustApp.getAdvancedVerification ? TrustApp.getAdvancedVerification(TrustApp.getUserId()) : null;
      var box = document.getElementById('verStatus');
      var submit = document.getElementById('advSubmit');
      if (v && v.image) {
        var box2 = document.getElementById('previewBox');
        box2.style.display = 'block';
        box2.innerHTML = '<img alt="Handheld ID" src="' + v.image + '"></div>';
      }
      if (v && v.status === 'pending') {
        box.style.display = 'block';
        box.className = 'ver-banner ver-pending';
        box.innerHTML = '<b>' + t('auth.underReview') + '</b>Your advanced verification is under review.';
        if (submit) submit.disabled = true;
      } else if (v && v.status === 'approved') {
        box.style.display = 'block';
        box.className = 'ver-banner ver-approved';
        box.innerHTML = '<b>' + t('auth.verified') + '</b>Your advanced verification has been approved.';
        if (submit) submit.disabled = true;
      } else if (v && v.status === 'rejected') {
        box.style.display = 'block';
        box.className = 'ver-banner ver-rejected';
        box.innerHTML = '<b>Rejected</b>' + (v.note || 'Your advanced verification was rejected. You may submit again.') + '';
        if (submit) submit.disabled = false;
      } else {
        box.style.display = 'none';
        if (submit) submit.disabled = false;
      }
    }

    document.getElementById('advInput').addEventListener('change', function () {
      var file = this.files && this.files[0];
      if (!file) return;
      if (!/^image\//.test(file.type)) { toast('error', 'Please choose an image file'); this.value = ''; return; }
      if (file.size > MAX_BYTES) { toast('error', 'Photo is too large (max 1.2MB)'); this.value = ''; return; }
      compress(file, function (dataUrl) {
        if (!dataUrl) { toast('error', 'Could not read photo'); return; }
        photo = dataUrl;
        var box = document.getElementById('previewBox');
        box.style.display = 'block';
        box.innerHTML = '<img alt="Handheld ID" src="' + dataUrl + '"><button type="button" class="adv-photo-remove" onclick="removePhoto()">&times;</button>';
        document.getElementById('uploadText').textContent = t('auth.changePhoto');
      });
      this.value = '';
    });

    function removePhoto() {
      photo = null;
      document.getElementById('previewBox').style.display = 'none';
      document.getElementById('previewBox').innerHTML = '';
      document.getElementById('uploadText').textContent = t('adv.clickUpload');
    }

    document.getElementById('advSubmit').onclick = function () {
      var uid = TrustApp.getUserId();
      if (!photo) { toast('error', 'Please upload your handheld ID photo'); return; }
      var res = TrustApp.submitAdvancedVerification(uid, { advanced: photo });
      if (!res.ok) { toast('error', res.msg); return; }
      toast('success', 'Advanced verification submitted successfully, please wait for review');
      renderStatus();
    };

    renderStatus();

    window.addEventListener('trustver', renderStatus);
    window.addEventListener('storage', function (e) {
      if (e.key === 'trustVerifications' || e.key === null) renderStatus();
    });
    var verSyncBusy = false;
    var verSyncDone = function () { verSyncBusy = false; };
    setInterval(function () {
      if (document.hidden || verSyncBusy) return;
      if (typeof DB === 'undefined' || !DB.pullBlob || !DB.ENABLED) return;
      verSyncBusy = true;
      DB.pullBlob('verifications').then(renderStatus).then(verSyncDone, verSyncDone);
    }, 1000);
  </script>
</body>
</html>
