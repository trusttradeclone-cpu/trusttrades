<!DOCTYPE html>
<html lang="en">
<head>
  <base href="./">
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no" />
  <meta name="color-scheme" content="light">
  <meta name="supported-color-schemes" content="light">
  <title>Customer Service</title>
  <link rel="icon" type="image/png" href="favicon.png">
  <link rel="apple-touch-icon" href="img/logo.png">
  <script src="scripts/config.js"></script>
  <script src="scripts/supabase-client.js"></script>
    <script src="scripts/db.js"></script>
  <script src="app.js"></script>
  <style>
    *{margin:0;padding:0;box-sizing:border-box;}
    body{font-family:system-ui,-apple-system,BlinkMacSystemFont,"PingFang SC",sans-serif;background:#f7f8fa;color:#333;}

    .page{display:flex;flex-direction:column;height:100vh;overflow:hidden;}

    .navbar{position:fixed;top:0;left:0;right:0;z-index:99999999;
            height:44px;display:flex;align-items:center;
            padding:0 12px;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.06);}
    .back-btn{display:flex;align-items:center;gap:4px;
              border:none;background:transparent;font-size:16px;cursor:pointer;
              position:relative;z-index:99999999;}
    .back-btn span{color:#333;}
    .close-btn{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);
             width:32px;height:32px;display:flex;align-items:center;justify-content:center;
             border:none;background:transparent;cursor:pointer;z-index:99999999;padding:0;}
    .close-btn svg{display:block;}

    .main{flex:1 1 auto;overflow:hidden;padding-top:44px;}

    @supports(padding:env(safe-area-inset-top)){
      .navbar{padding-top:env(safe-area-inset-top);
              padding-left:calc(env(safe-area-inset-left)+12px);
              height:calc(44px + env(safe-area-inset-top));}
      .main{padding-top:calc(44px + env(safe-area-inset-top));
            padding-bottom:env(safe-area-inset-bottom);}
    }

    .msg-wrap{height:100%;display:flex;flex-direction:column;background:#fff;}
    .msg-head{padding:12px 16px;display:flex;align-items:center;gap:10px;
              background:#fff;border-bottom:1px solid #eef0f4;flex:none;}
    .msg-avatar{width:38px;height:38px;border-radius:50%;background:#fff;overflow:hidden;
                display:flex;align-items:center;justify-content:center;flex:none;
                border:1px solid #eef0f4;}
    .msg-avatar img{width:100%;height:100%;object-fit:cover;display:block;}
    .msg-title{font-size:15px;font-weight:700;color:#131f30;line-height:1.2;}
    .msg-status{font-size:12px;color:#16a34a;margin-top:1px;}
    .msg-body{flex:1 1 auto;overflow-y:auto;padding:16px;background:#f2f4f8;
              display:flex;flex-direction:column;gap:10px;}
    .msg-welcome{margin:auto;text-align:center;padding:10px 0;width:100%;}
    .msg-welcome-title{font-size:18px;font-weight:800;color:#131f30;}
    .msg-welcome-sub{font-size:13px;color:#8a94a6;margin:6px 0 18px;}
    .msg-options{display:grid;grid-template-columns:1fr 1fr;gap:12px;max-width:340px;margin:0 auto;}
    .msg-option{display:flex;flex-direction:column;align-items:center;gap:8px;background:#fff;
                border:1px solid #eef0f4;border-radius:14px;padding:18px 12px;
                cursor:pointer;box-shadow:0 1px 3px rgba(0,0,0,.05);}
    .msg-option:active{background:#f5f7fb;}
    .mo-icon{width:46px;height:46px;border-radius:50%;background:#eef4ff;display:flex;
             align-items:center;justify-content:center;}
    .msg-option b{font-size:14px;color:#131f30;}
    .msg-option span{font-size:11px;color:#8a94a6;margin-top:2px;}
    .msg-bubble{max-width:82%;padding:10px 14px;border-radius:16px;font-size:14px;line-height:1.5;word-break:break-word;}
    .msg-bubble.user{align-self:flex-end;background:#1652f0;color:#fff;border-bottom-right-radius:4px;}
    .msg-bubble.admin{align-self:flex-start;background:#fff;color:#333;border:1px solid #eef0f4;border-bottom-left-radius:4px;}
    .msg-time{display:block;font-size:11px;opacity:.7;margin-top:4px;}
    .msg-bubble.user .msg-time{color:#e3ecff;}
    .msg-bubble.admin .msg-time{color:#9aa3b2;}
    .msg-input-row{flex:none;padding:10px 12px calc(10px + env(safe-area-inset-bottom));
                   background:#fff;border-top:1px solid #eef0f4;display:flex;gap:10px;align-items:center;}
    .msg-input-row input{flex:1;min-width:0;border:1px solid #dfe3ea;border-radius:20px;
                         padding:11px 16px;font-size:14px;outline:none;background:#f7f8fa;}
    .msg-input-row input:focus{border-color:#1652f0;background:#fff;}
    .msg-input-row button{border:none;background:#1652f0;color:#fff;border-radius:20px;
                          padding:11px 20px;font-size:14px;font-weight:600;cursor:pointer;flex:none;}
    .msg-input-row button:active{opacity:.85;}
    .msg-attach{flex:none;width:42px;height:42px;border:1px solid #dfe3ea;border-radius:50%;
                background:#f7f8fa;color:#5b6472;display:flex;align-items:center;justify-content:center;cursor:pointer;}
    .msg-attach:active{background:#eef0f4;}
    .msg-input-row .msg-attach{border:1px solid #dfe3ea;border-radius:50%;background:#f7f8fa;color:#5b6472;padding:0;}
    .msg-input-row .msg-attach:active{background:#eef0f4;}
    .msg-attach svg{width:24px;height:24px;}
    .msg-pending{flex:none;display:flex;flex-wrap:wrap;gap:8px;padding:10px 12px 0;
                 background:#fff;}
    .pending-chip{display:flex;align-items:center;gap:8px;background:#eef4ff;color:#1652f0;
                  border-radius:10px;padding:6px 10px;font-size:12px;max-width:190px;}
    .pending-chip span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
    .pending-chip button{border:none;background:transparent;color:#5b6472;font-size:14px;
                         cursor:pointer;line-height:1;padding:0;}
    .pending-thumb{width:34px;height:34px;border-radius:6px;object-fit:cover;flex:none;background:#fff;}
    .msg-bubble .chat-att-img,.msg-bubble .chat-att-video,.msg-bubble .chat-att-file{margin-top:8px;}
    .chat-att-img{max-width:200px;max-height:200px;border-radius:8px;display:block;cursor:zoom-in;object-fit:contain;background:#fff;width:100%}
    .chat-att-video{max-width:200px;max-height:200px;border-radius:8px;background:#000}
    .chat-att-file{display:flex;align-items:center;gap:7px;padding:9px 11px;background:#fff;border:1px solid #e0e4ec;border-radius:9px;color:#1652f0;text-decoration:none;font-size:13px;max-width:230px;word-break:break-all}
    .chat-att-file svg{flex:none}

    .img-lightbox-overlay{position:fixed;inset:0;z-index:99999;background:rgba(0,0,0,.82);backdrop-filter:blur(4px);display:flex;align-items:center;justify-content:center;padding:20px;cursor:zoom-out;animation:lbFadeIn .15s}
    @keyframes lbFadeIn{from{opacity:0}to{opacity:1}}
    .img-lightbox-overlay img{max-width:92vw;max-height:88vh;border-radius:10px;box-shadow:0 8px 40px rgba(0,0,0,.45);object-fit:contain;cursor:default}
    .img-lightbox-close{position:fixed;top:16px;right:20px;width:38px;height:38px;border-radius:50%;border:none;background:rgba(255,255,255,.15);color:#fff;font-size:22px;cursor:pointer;display:flex;align-items:center;justify-content:center;z-index:100000;transition:background .15s}
    .img-lightbox-close:hover{background:rgba(255,255,255,.3)}
  </style>
</head>
<body>
  <div class="page">
    <header class="navbar">
      <button class="back-btn" type="button" onclick="handleBackNavigation()">
        <svg viewBox="0 0 24 24" width="24" height="24" fill="#333" xmlns="http://www.w3.org/2000/svg">
          <path d="M15.41 7.41 14 6l-6 6 6 6 1.41-1.41L10.83 12z"/>
        </svg>
        <span data-i18n="svc.back">Back</span>
      </button>
      <button class="close-btn" type="button" aria-label="Close" onclick="handleBackNavigation()">
        <svg viewBox="0 0 24 24" width="23" height="23" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
          <path d="M6 6L18 18" stroke="#333" stroke-width="2" stroke-linecap="round"/>
          <path d="M18 6L6 18" stroke="#333" stroke-width="2" stroke-linecap="round"/>
        </svg>
      </button>
    </header>

    <main class="main">
      <div class="msg-wrap">
        <div class="msg-head">
          <div class="msg-avatar"><img src="img/logo.png" alt="Customer Service"></div>
          <div>
            <div class="msg-title" data-i18n="svc.title">Customer Service</div>
            <div class="msg-status">&#9679; <span data-i18n="svc.online">Online</span></div>
          </div>
        </div>

        <div class="msg-body" id="msgBody">
          <div class="msg-welcome" id="welcome">
            <div class="msg-welcome-title" data-i18n="svc.welcome">Welcome</div>
            <div class="msg-welcome-sub" data-i18n="svc.welcomeSub">How can we help you today?</div>
            <div class="msg-options">
              <div class="msg-option" onclick="openChat()">
                <div class="mo-icon">
                  <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#1652f0" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"></path><path d="M8 9h8M8 13h6"></path></svg>
                </div>
                <div>
                  <b data-i18n="svc.liveChat">Live Chat</b>
                  <span data-i18n="svc.chatNow">Chat with support now</span>
                </div>
              </div>
              <div class="msg-option" onclick="location.href='mailto:support@trustcom.vip'">
                <div class="mo-icon">
                  <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#1652f0" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="4" width="20" height="16" rx="2"></rect><path d="m22 7-10 6L2 7"></path></svg>
                </div>
                <div>
                  <b data-i18n="svc.emailSupport">Email Support</b>
                  <span>support@trustcom.vip</span>
                </div>
              </div>
            </div>
          </div>
        </div>

        <div class="msg-pending" id="pendingRow" style="display:none;"></div>
        <div class="msg-input-row">
          <button type="button" class="msg-attach" id="attachBtn" aria-label="Attach">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21.44 11.05l-9.19 9.19a6 6 0 0 1-8.49-8.49l9.19-9.19a4 4 0 0 1 5.66 5.66l-9.2 9.19a2 2 0 0 1-2.83-2.83l8.49-8.48"></path></svg>
          </button>
          <input type="file" id="attachInput" accept="image/*,video/*,.pdf,.doc,.docx,.xls,.xlsx,.txt,.zip,.rar,.csv" multiple style="display:none;">
          <input type="text" id="chatInput" placeholder="Type a message..." data-i18n-ph="svc.typeMessage" autocomplete="off">
          <button type="button" id="chatSend" data-i18n="svc.send">Send</button>
        </div>
      </div>
    </main>
  </div>

  <script>
    function handleBackNavigation() {
      if (history.length > 1) {
        history.back();
      } else {
        location.href = 'index.html';
      }
    }
    function openChat() {
      var input = document.getElementById('chatInput');
      if (input) setTimeout(function () { input.focus(); }, 200);
    }

    function guestUid() {
      // Guests are real rows in Supabase; create/restore one asynchronously.
      if (TrustApp.ensureGuest) {
        return TrustApp.ensureGuest().then(function (g) { return g; }).catch(function () { return null; });
      }
      return Promise.resolve(TrustApp.getUserId() || null);
    }

    var uid = null;
    window.addEventListener('trustsync:users', function () { render(); });
    window.addEventListener('trustsync:chat_messages', function () { render(); });
    guestUid().then(function (g) {
      uid = g;
      TrustApp.ensureSupportGreeting(uid);
      render();
    });
    var pinnedBottom = true;

    var MAX_ATT_BYTES = 1200000;
    var pending = [];

    function esc(s) {
      return TrustApp.escHtml ? TrustApp.escHtml(s) : String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
        return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
      });
    }

    function fileKind(file) {
      if (file.type && file.type.indexOf('image/') === 0) return 'image';
      if (file.type && file.type.indexOf('video/') === 0) return 'video';
      return 'file';
    }

    function compressImage(file, cb) {
      var img = new Image();
      var url = URL.createObjectURL(file);
      img.onload = function () {
        var maxW = 700;
        var scale = Math.min(1, maxW / img.width);
        var w = Math.max(1, Math.round(img.width * scale));
        var h = Math.max(1, Math.round(img.height * scale));
        var canvas = document.createElement('canvas');
        canvas.width = w; canvas.height = h;
        var ctx = canvas.getContext('2d');
        ctx.drawImage(img, 0, 0, w, h);
        URL.revokeObjectURL(url);
        cb(canvas.toDataURL('image/jpeg', 0.7));
      };
      img.onerror = function () { URL.revokeObjectURL(url); cb(null); };
      img.src = url;
    }

    function readFileData(file, cb) {
      var r = new FileReader();
      r.onload = function () { cb(r.result); };
      r.onerror = function () { cb(null); };
      r.readAsDataURL(file);
    }

    function addFiles(fileList) {
      var files = Array.prototype.slice.call(fileList);
      files.forEach(function (f) {
        if (pending.length >= 6) { toast('error', TrustApp.t('svc.attachLimit')); return; }
        if (f.size > MAX_ATT_BYTES) { toast('error', TrustApp.t('svc.fileTooLarge').replace('{n}', f.name)); return; }
        var kind = fileKind(f);
        var done = function (data) {
          if (!data) { toast('error', TrustApp.t('svc.fileReadErr').replace('{n}', f.name)); return; }
          pending.push({ kind: kind, name: f.name, data: data, size: f.size });
          renderPending();
        };
        if (kind === 'image') {
          compressImage(f, function (dataUrl) {
            if (dataUrl) done(dataUrl);
            else readFileData(f, done);
          });
        } else {
          readFileData(f, done);
        }
      });
      if (document.getElementById('attachInput')) document.getElementById('attachInput').value = '';
    }

    function renderPending() {
      var row = document.getElementById('pendingRow');
      if (!pending.length) { row.style.display = 'none'; row.innerHTML = ''; return; }
      row.style.display = 'flex';
      row.innerHTML = pending.map(function (a, i) {
        var thumb = a.kind === 'image' ? '<img class="pending-thumb" src="' + a.data + '" alt="">' : '';
        return '<div class="pending-chip">' + thumb + '<span>' + esc(a.name) + '</span><button type="button" onclick="removePending(' + i + ')">&times;</button></div>';
      }).join('');
    }

    function removePending(i) {
      pending.splice(i, 1);
      renderPending();
    }

    function sendMessage(text) {
      if (!text.trim() && !pending.length) return;
      if (!uid) { toast('error', TrustApp.t('svc.unableConnect')); return; }
      TrustApp.sendChatMsg(uid, 'user', text.trim(), pending);
      pending = [];
      renderPending();
      document.getElementById('chatInput').value = '';
      pinnedBottom = true;
      render();
    }

    function render() {
      var body = document.getElementById('msgBody');
      var welcome = document.getElementById('welcome');
      var msgs = uid ? TrustApp.getChat(uid) : [];
      body.innerHTML = msgs.map(function (m) {
        var cls = m.from === 'admin' ? 'admin' : 'user';
        var tm = (m.at || '').replace('T', ' ').slice(5, 16);
        var text = m.text ? esc(m.text) : (TrustApp.attLabel ? esc(TrustApp.attLabel(m.attachments)) : '');
        var atts = TrustApp.renderAttachments ? TrustApp.renderAttachments(m.attachments) : '';
        return '<div class="msg-bubble ' + cls + '">' + text + atts + '<span class="msg-time">' + tm + '</span></div>';
      }).join('');
      if (welcome) {
        welcome.style.display = msgs.length ? 'none' : '';
        body.appendChild(welcome);
      }
      if (pinnedBottom) body.scrollTop = body.scrollHeight;
    }
    var msgBodyEl = document.getElementById('msgBody');
    msgBodyEl.addEventListener('scroll', function () {
      pinnedBottom = (msgBodyEl.scrollHeight - msgBodyEl.scrollTop - msgBodyEl.clientHeight) < 60;
    });
    document.getElementById('attachBtn').onclick = function () {
      document.getElementById('attachInput').click();
    };
    document.getElementById('attachInput').addEventListener('change', function (e) {
      if (e.target.files && e.target.files.length) addFiles(e.target.files);
    });
    document.getElementById('chatSend').onclick = function () {
      sendMessage(document.getElementById('chatInput').value);
    };
    document.getElementById('chatInput').addEventListener('keydown', function (e) {
      if (e.key === 'Enter') sendMessage(e.target.value);
    });
    render();
    setInterval(render, 2000);
  </script>
</body>
</html>
