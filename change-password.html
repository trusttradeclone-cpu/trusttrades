<!DOCTYPE html>
<html lang="en">
<head>
  <base href="./">
  <meta charset="utf-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <meta name="color-scheme" content="light">
  <link rel="icon" type="image/png" href="favicon.png">
  <link rel="apple-touch-icon" href="img/logo.png">
  <title>Trust - Change Password</title>
  <link rel="stylesheet" href="styles.css">
  <script src="scripts/config.js"></script>
  <script src="scripts/db.js"></script>
  <script src="app.js"></script>
</head>
<body>
  <div id="app">
    <header class="sub-header">
      <button class="back-btn" onclick="location.href='account.html'" aria-label="Back">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none"><path d="M15 18L9 12L15 6" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </button>
      <span class="header-title" data-i18n="cp.title">Change Password</span>
      <span class="header-spacer"></span>
    </header>
    <div class="login-container">
      <div class="login-wrapper">
        <div>
          <div class="logo"><img src="img/logo.png" alt="Logo" class="logo-image"></div>
          <form class="register-form" id="changeForm" onsubmit="return doChange(event)">
            <div class="input-group"><input type="password" placeholder="Current Password" class="input-field" id="currentPass" data-i18n-ph="cp.current" required></div>
            <div class="input-group"><input type="password" placeholder="New Password (at least 6 characters)" class="input-field" id="newPass" data-i18n-ph="cp.new" required></div>
            <div class="input-group"><input type="password" placeholder="Confirm New Password" class="input-field" id="confirmPass" data-i18n-ph="cp.confirm" required></div>
            <button type="submit" class="register-button" id="changeBtn" data-i18n="cp.confirmBtn">Confirm</button>
            <div class="links">
              <a href="account.html" class="link">
                <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4"></path><polyline points="10 17 15 12 10 7"></polyline><line x1="15" y1="12" x2="3" y2="12"></line></svg>
                <span data-i18n="cp.backToAccount">Back to Account</span>
              </a>
              <a href="javascript:void(0);" class="link" onclick="location.href='service.html'">
                <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"></path></svg>
                <span data-i18n="common.onlineService">Online Service</span>
              </a>
            </div>
          </form>
        </div>
      </div>
    </div>
  </div>

  <div class="toast-overlay" id="toastBox"></div>

  <script>
    var f = document.getElementById('changeForm');
    var btn = document.getElementById('changeBtn');
    var inputs = f.querySelectorAll('.input-field');
    function updateBtn() {
      var empty = !inputs[0].value || !inputs[1].value || !inputs[2].value;
      btn.disabled = empty;
      btn.classList.toggle('disabled', empty);
    }
    inputs.forEach(function (inp) { inp.addEventListener('input', updateBtn); });
    updateBtn();

    function doChange(ev) {
      if (ev) ev.preventDefault();
      var cur = inputs[0].value;
      var nw = inputs[1].value;
      var cf = inputs[2].value;
      if (!cur || !nw || !cf) { toast('error', 'Please fill in all fields'); return false; }
      if (nw.length < 6) { toast('error', 'New password must be at least 6 characters'); return false; }
      if (nw !== cf) { toast('error', 'Passwords do not match'); return false; }
      var uid = TrustApp.getUserId();
      var res = TrustApp.changePassword(uid, cur, nw);
      if (!res.ok) { toast('error', res.msg); return false; }
      toast('success', 'Password changed successfully');
      setTimeout(function () { location.href = 'account.html'; }, 1500);
      return false;
    }
  </script>
</body>
</html>
